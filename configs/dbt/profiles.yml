ecom_stock_pipeline:
  target: starrocks
  outputs:
    starrocks:
      type: starrocks
      driver: mysql
      host: starrocks-fe
      port: 9030
      user: root
      password: ""
      database: ecom_data
      schema: analytics
      threads: 4
      connect_timeout: 10
      read_timeout: 30

    dev:
      type: starrocks
      driver: mysql
      host: localhost
      port: 9030
      user: root
      password: ""
      database: ecom_data
      schema: analytics_dev
      threads: 2
