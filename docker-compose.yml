version: "3.8"

# ===========================================
# Ecom Stock Pipeline - Docker Compose
# Tech: Vault | Airflow | StarRocks | dbt | MinIO | Kafka | Flink
# ===========================================

x-airflow-common: &airflow-common
  image: ${AIRFLOW_IMAGE_NAME}
  environment:
    AIRFLOW__CORE__EXECUTOR: ${AIRFLOW__CORE__EXECUTOR:-CeleryExecutor}
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW__DATABASE__SQL_ALCHEMY_CONN}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW__CORE__FERNET_KEY}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: ${AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION}
    AIRFLOW__CORE__LOAD_EXAMPLES: ${AIRFLOW__CORE__LOAD_EXAMPLES}
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: ${AIRFLOW__WEBSERVER__EXPOSE_CONFIG}
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://airflow:airflow@postgres-airflow:5432/airflow
    AIRFLOW__CELERY__BROKER_URL: redis://redis-airflow:6379/0
    AIRFLOW__CORE__AIRFLOW_HOME: /opt/airflow
    VAULT_ADDR: ${VAULT_ADDR}
    MINIO_ENDPOINT: http://minio:9000
    MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
    MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./scripts:/opt/airflow/scripts
    - ./configs/airflow:/opt/airflow/configs
  depends_on:
    postgres-airflow:
      condition: service_healthy
    redis-airflow:
      condition: service_healthy
    vault:
      condition: service_started
    minio:
      condition: service_started

services:
  # ==========================================
  # VAULT - Secrets Management
  # ==========================================
  vault:
    image: hashicorp/vault:1.15
    container_name: ecom-vault
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN_ID}
      VAULT_DEV_LISTEN_ADDRESS: ${VAULT_DEV_LISTEN_ADDRESS}
      VAULT_ADDR: http://127.0.0.1:8200
    ports:
      - "8200:8200"
    volumes:
      - ./configs/vault/vault-config.hcl:/vault/config/vault-config.hcl
      - ./volumes/vault:/vault/file
    command: server -dev -config=/vault/config/vault-config.hcl
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecom-net

  # ==========================================
  # POSTGRES - Airflow Metadata
  # ==========================================
  postgres-airflow:
    image: postgres:15
    container_name: ecom-postgres-airflow
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - ./volumes/airflow/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecom-net

  # ==========================================
  # REDIS - Airflow Celery Broker
  # ==========================================
  redis-airflow:
    image: redis:7
    container_name: ecom-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecom-net

  # ==========================================
  # AIRFLOW - Workflow Orchestration
  # ==========================================
  airflow-init:
    <<: *airflow-common
    container_name: ecom-airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin \
          --password admin \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com || true
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    container_name: ecom-airflow-webserver
    ports:
      - "8080:8080"
    command: webserver
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: ecom-airflow-scheduler
    command: scheduler
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-worker:
    <<: *airflow-common
    container_name: ecom-airflow-worker
    command: celery worker
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-triggerer:
    <<: *airflow-common
    container_name: ecom-airflow-triggerer
    command: triggerer
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # ==========================================
  # MINIO - Object Storage (S3-compatible)
  # ==========================================
  minio:
    image: minio/minio:latest
    container_name: ecom-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./volumes/minio:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecom-net

  # ==========================================
  # ZOOKEEPER - Kafka Dependency
  # ==========================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: ecom-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - ./volumes/kafka/zookeeper:/var/lib/zookeeper/data
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecom-net

  # ==========================================
  # KAFKA - Message Streaming
  # ==========================================
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: ecom-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: ${KAFKA_ZOOKEEPER_CONNECT}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "9092:9092"
      - "29092:29092"
    volumes:
      - ./volumes/kafka/kafka:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - ecom-net

  # ==========================================
  # APICURIO - Schema Registry
  # ==========================================
  apicurio:
    image: quay.io/apicurio/apicurio-registry:latest
    container_name: ecom-apicurio
    environment:
      QUARKUS_PROFILE: prod
      QUARKUS_HTTP_PORT: 8080
      APICURIO_STORAGE_KIND: sql
      APICURIO_STORAGE_SQL_KIND: postgresql
      APICURIO_STORAGE_SQL_URL: jdbc:postgresql://ecom-postgres-apicurio:5432/apicurio
      APICURIO_STORAGE_SQL_USER: apicurio
      APICURIO_STORAGE_SQL_PASSWORD: apicurio
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://ecom-postgres-apicurio:5432/apicurio
      QUARKUS_DATASOURCE_USERNAME: apicurio
      QUARKUS_DATASOURCE_PASSWORD: apicurio
    ports:
      - "8085:8080"
    depends_on:
      postgres-apicurio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecom-net

  postgres-apicurio:
    image: postgres:15
    container_name: ecom-postgres-apicurio
    environment:
      POSTGRES_USER: apicurio
      POSTGRES_PASSWORD: apicurio
      POSTGRES_DB: apicurio
    volumes:
      - ./volumes/apicurio:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apicurio"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecom-net

  # ==========================================
  # KAFKA UI - Web Interface
  # ==========================================
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: ecom-kafka-ui
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://apicurio:8080
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: default
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://kafka-connect:8083
      DYNAMIC_CONFIG_ENABLED: "true"
    ports:
      - "8086:8080"
    depends_on:
      kafka:
        condition: service_healthy
      apicurio:
        condition: service_healthy
    networks:
      - ecom-net

  # ==========================================
  # STARROCKS - Data Warehouse
  # ==========================================
  starrocks-fe:
    image: starrocks/fe-ubuntu:3.1-latest
    container_name: ecom-starrocks-fe
    environment:
      - FE_SERVERS=fe1:starrocks-fe:9010
      - FE_ID=1
    ports:
      - "8030:8030"
      - "9030:9030"
    volumes:
      - ./volumes/starrocks/fe:/opt/starrocks/fe/image
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:8030/api/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - ecom-net

  starrocks-be:
    image: starrocks/be-ubuntu:3.1-latest
    container_name: ecom-starrocks-be
    environment:
      - FE_HOSTS=starrocks-fe:9010
      - BE_ADDR=starrocks-be:9050
    ports:
      - "8040:8040"
      - "9050:9050"
    depends_on:
      starrocks-fe:
        condition: service_healthy
    volumes:
      - ./volumes/starrocks/be:/opt/starrocks/be/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:8040/api/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - ecom-net

  # ==========================================
  # FLINK - Stream Processing
  # ==========================================
  flink-jobmanager:
    image: flink:1.18-java11
    container_name: ecom-flink-jobmanager
    ports:
      - "8081:8081"
      - "6123:6123"
    command: jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        jobmanager.rpc.port: 6123
        jobmanager.memory.process.size: 1600m
        state.backend: rocksdb
        state.checkpoints.dir: file:///opt/flink/checkpoints
        state.savepoints.dir: file:///opt/flink/savepoints
    volumes:
      - ./configs/flink/flink-conf.yaml:/opt/flink/conf/flink-conf.yaml
      - ./volumes/flink/checkpoints:/opt/flink/checkpoints
      - ./volumes/flink/savepoints:/opt/flink/savepoints
    networks:
      - ecom-net

  flink-taskmanager:
    image: flink:1.18-java11
    container_name: ecom-flink-taskmanager
    depends_on:
      - flink-jobmanager
    command: taskmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        jobmanager.rpc.port: 6123
        taskmanager.memory.process.size: 1728m
        taskmanager.numberOfTaskSlots: 2
        state.backend: rocksdb
        state.checkpoints.dir: file:///opt/flink/checkpoints
        state.savepoints.dir: file:///opt/flink/savepoints
    volumes:
      - ./configs/flink/flink-conf.yaml:/opt/flink/conf/flink-conf.yaml
      - ./volumes/flink/checkpoints:/opt/flink/checkpoints
      - ./volumes/flink/savepoints:/opt/flink/savepoints
    networks:
      - ecom-net

  # ==========================================
  # DBT - Data Transformation
  # ==========================================
  dbt:
    build:
      context: ./dbt
      dockerfile: Dockerfile
    image: ecom-dbt:latest
    pull_policy: build
    container_name: ecom-dbt
    environment:
      DBT_PROFILES_DIR: /opt/dbt
      DBT_TARGET: starrocks
    volumes:
      - ./dbt:/opt/dbt
      - ./configs/dbt/profiles.yml:/opt/dbt/profiles.yml
    depends_on:
      starrocks-fe:
        condition: service_healthy
    stdin_open: true
    tty: true
    networks:
      - ecom-net

  # ==========================================
  # DATA GENERATOR - Synthetic Data → Files
  # ==========================================
  data-generator:
    build:
      context: ./generators
      dockerfile: Dockerfile
    container_name: ecom-data-generator
    environment:
      DATA_DIR: /data/raw
    volumes:
      - ./volumes/raw-data:/data/raw
    networks:
      - ecom-net

# ==========================================
# NETWORKS
# ==========================================
networks:
  ecom-net:
    driver: bridge

# ==========================================
# VOLUMES
# ==========================================
volumes:
  vault-data:
  minio-data:
  kafka-data:
  zookeeper-data:
  starrocks-fe-data:
  starrocks-be-data:
  postgres-airflow-data:
  raw-data:
