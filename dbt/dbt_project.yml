# ===========================================
# dbt Project Configuration
# ===========================================

name: 'ecom_stock_pipeline'
version: '1.0.0'
config-version: 2

profile: 'ecom_stock_pipeline'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  ecom_stock_pipeline:
    +materialized: view
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: ephemeral
      +schema: intermediate
    marts:
      +materialized: table
      +schema: analytics

seeds:
  ecom_stock_pipeline:
    +schema: seeds

vars:
  start_date: '2024-01-01'
